name: Build Android APK (RETIRED)

# ─────────────────────────────────────────────────────────────────────────────
# RETIRED: the Capacitor/WebView build (app/mobile) has been discontinued.
# We now ship ONLY the native Kotlin app — see android-native-build.yml, which
# publishes RecoverIQ-native.apk to the "android-native-latest" release.
#
# Why this was removed:
#   - It shared the package id `in.recoveriq.app` with the native app but was
#     signed with a DIFFERENT (random, per-build) debug key, so phones that had
#     one variant could not install the other — Android aborted at "Preparing…".
#
# This file is intentionally a no-op so it can never auto-run on a push nor
# publish a conflicting APK. Delete the old "android-latest" GitHub Release/tag
# so nobody downloads the stale, broken APK.
# ─────────────────────────────────────────────────────────────────────────────

on:
  workflow_dispatch:   # manual only — never triggers on push

jobs:
  retired:
    runs-on: ubuntu-latest
    steps:
      - name: Notice
        run: |
          echo "This workflow is retired. Use 'Build Native Android App' instead,"
          echo "which publishes RecoverIQ-native.apk to the android-native-latest release."
