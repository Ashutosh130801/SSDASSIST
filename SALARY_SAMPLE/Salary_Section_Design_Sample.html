<!DOCTYPE html>
<html lang="en"><head><meta charset="utf-8"><title>RecoverIQ — Salary & Payslips (design sample)</title>
<meta name="viewport" content="width=device-width,initial-scale=1">
<style>
:root{--brand:#2563eb;--navy:#1e3a8a;--ink:#0f172a;--muted:#64748b;--line:#e2e8f0;--soft:#eff6ff;--ok:#16a34a;--warn:#d97706;--bad:#dc2626}
*{box-sizing:border-box}body{margin:0;font-family:Inter,Segoe UI,system-ui,sans-serif;background:linear-gradient(160deg,#f8fbff,#eef4ff);color:var(--ink);font-size:13.5px}
.top{display:flex;align-items:center;gap:12px;padding:10px 18px;background:#fff;border-bottom:1px solid var(--line);position:sticky;top:0;z-index:5}
.top img{height:30px}.top b{font-size:16px;color:var(--navy)}.top .sp{flex:1}.pill{padding:3px 10px;border-radius:20px;font-size:11.5px;font-weight:700}
.wrap{display:flex}.nav{width:210px;padding:14px 10px;background:#fff;border-right:1px solid var(--line);min-height:calc(100vh - 51px)}
.nav div{padding:8px 12px;border-radius:9px;color:var(--muted);margin-bottom:2px;cursor:default}.nav .on{background:var(--soft);color:var(--brand);font-weight:700}
main{flex:1;padding:18px 22px;max-width:1350px}
h1{font-size:21px;margin:0 0 2px;color:var(--navy)}.muted{color:var(--muted)}
.card{background:rgba(255,255,255,.85);border:1px solid var(--line);border-radius:14px;padding:14px;box-shadow:0 2px 10px rgba(30,58,138,.05)}
.kpis{display:grid;grid-template-columns:repeat(5,1fr);gap:10px;margin:14px 0}.kpi .k{font-size:11px;color:var(--muted);text-transform:uppercase;letter-spacing:.4px}.kpi b{font-size:20px;display:block;margin-top:3px}
.tabs{display:flex;gap:6px;margin:6px 0 12px;flex-wrap:wrap}.chip{padding:6px 13px;border-radius:20px;border:1px solid var(--line);background:#fff;cursor:pointer;font-weight:600;color:var(--muted)}.chip.on{background:var(--brand);color:#fff;border-color:var(--brand)}
.steps{display:flex;gap:0;margin:12px 0 4px}.st{flex:1;text-align:center;font-size:11.5px;color:var(--muted);position:relative}
.st i{display:flex;width:26px;height:26px;border-radius:50%;margin:0 auto 4px;align-items:center;justify-content:center;background:#e2e8f0;font-style:normal;font-weight:800;color:#475569}
.st.done i{background:var(--ok);color:#fff}.st.cur i{background:var(--brand);color:#fff;box-shadow:0 0 0 4px #bfdbfe}.st.cur{color:var(--brand);font-weight:700}
.st:not(:last-child):after{content:"";position:absolute;top:13px;left:calc(50% + 16px);right:calc(-50% + 16px);height:2px;background:#e2e8f0}.st.done:after{background:var(--ok)}
table{width:100%;border-collapse:collapse}th{background:var(--navy);color:#fff;font-size:11.5px;padding:8px 7px;text-align:left;white-space:nowrap}
td{padding:7px;border-bottom:1px solid var(--line);font-size:12.8px}tr.ex td{color:#94a3b8;background:#f8fafc}tr.ex td.nm{text-decoration:line-through}
td.r,th.r{text-align:right;white-space:nowrap}.net{font-weight:800;color:var(--ok)}.btn{padding:8px 14px;border-radius:9px;border:1px solid var(--line);background:#fff;font-weight:700;cursor:pointer;font-size:12.8px}
.btn.p{background:var(--brand);color:#fff;border-color:var(--brand)}.btn.g{background:var(--ok);color:#fff;border-color:var(--ok)}.btn:disabled{opacity:.45;cursor:not-allowed}
.bar{display:flex;gap:8px;align-items:center;flex-wrap:wrap}.tag{font-size:10.5px;padding:2px 7px;border-radius:6px;font-weight:700}
.t-ok{background:#dcfce7;color:#166534}.t-w{background:#fef3c7;color:#92400e}.t-b{background:#fee2e2;color:#991b1b}.t-i{background:var(--soft);color:var(--brand)}
input[type=checkbox]{width:16px;height:16px;accent-color:var(--brand)}input.s{padding:7px 10px;border:1px solid var(--line);border-radius:8px;min-width:220px}
.modal{position:fixed;inset:0;background:rgba(15,23,42,.45);display:none;align-items:center;justify-content:center;z-index:20}.modal.on{display:flex}
.mbox{background:#fff;border-radius:16px;width:min(760px,94vw);max-height:92vh;overflow:auto;box-shadow:0 20px 60px rgba(0,0,0,.25)}
.ps-h{background:linear-gradient(120deg,#1e3a8a,#2563eb);color:#fff;padding:16px 20px;display:flex;gap:14px;align-items:center}.ps-h img{height:46px;background:#fff;border-radius:8px;padding:2px}
.grid3{display:grid;grid-template-columns:repeat(3,1fr);gap:8px 14px;background:var(--soft);margin:14px 18px;padding:12px;border-radius:10px}.grid3 small{display:block;color:var(--muted);font-size:10px;text-transform:uppercase}
.two{display:grid;grid-template-columns:1fr 1fr;gap:12px;margin:0 18px}.two td{font-size:12.5px}.two th{position:static}
.netb{margin:14px 18px;background:#166534;color:#fff;border-radius:10px;padding:12px 16px;display:flex;justify-content:space-between;align-items:center}.netb b{font-size:22px}
.note{font-size:12px;background:#fffbeb;border:1px solid #fde68a;color:#92400e;padding:8px 12px;border-radius:9px}
.lock{background:#f0fdf4;border:1px solid #bbf7d0;color:#166534;padding:8px 12px;border-radius:9px;font-size:12.5px}
.audit div{padding:7px 0;border-bottom:1px dashed var(--line);font-size:12.5px}.audit span{color:var(--muted);display:inline-block;width:150px}
@media(max-width:1100px){.nav{display:none}.kpis{grid-template-columns:repeat(3,1fr)}}
.demo{position:fixed;bottom:10px;right:12px;background:#dc2626;color:#fff;font-size:11px;font-weight:800;padding:5px 10px;border-radius:8px;z-index:30}
</style></head><body>

function runs(){const R=[['PR-2026-11-001',D.month,'21-Oct → 20-Nov',inc().length,inc().reduce((a,r)=>a+r.net,0),STAGES[stage]],['PR-2026-10-001','OCT 2026','21-Sep → 20-Oct',7,128410,'Paid (UTR matched)'],['PR-2026-09-001','SEP 2026','21-Aug → 20-Sep',6,112870,'Paid (UTR matched)']];
return `<div class="card"><div class="bar" style="margin-bottom:10px"><b>Payroll runs</b><span style="flex:1"></span><button class="btn p" onclick="alert('Demo: creates a Draft run for the next cycle, pulling attendance + leaves')">＋ New run (DEC 2026 cycle)</button></div>
<table><tr><th>Run</th><th>Month</th><th>Cycle</th><th class="r">Employees</th><th class="r">Net paid</th><th>Status</th><th></th></tr>${R.map(x=>`<tr><td><b>${x[0]}</b></td><td>${x[1]}</td><td>${x[2]}</td><td class="r">${x[3]}</td><td class="r net">${inr(x[4])}</td><td><span class="tag ${x[5].startsWith('Paid')?'t-ok':'t-i'}">${x[5]}</span></td><td><button class="btn" onclick="tab='run';render()">Open</button> <button class="btn">⬇ Register</button> <button class="btn">⬇ All payslips (zip)</button></td></tr>`).join('')}</table></div>`}
function struct(){return `<div class="card"><div class="bar" style="margin-bottom:10px"><b>Salary structure per employee</b><span class="muted">· effective-dated · changes need Admin and are audited</span><span style="flex:1"></span><button class="btn">⬆ Bulk upload (Excel)</button></div>
<table><tr><th>Employee</th><th class="r">Monthly gross</th><th class="r">Basic</th><th class="r">HRA</th><th class="r">Conv.</th><th class="r">Special</th><th>PF</th><th>ESI</th><th>PT</th><th>On payroll</th><th>Effective from</th></tr>
${rows.map(r=>`<tr class="${r.gross?'':'ex'}"><td><b>${r.name}</b> <span class="muted">(${r.code})</span></td><td class="r">${inr(r.gross)}</td>${r.earnings.slice(0,4).map(e=>`<td class="r">${inr(e[1])}</td>`).join('')}<td>${r.gross?'✓':'—'}</td><td>${r.gross&&r.gross<=21000?'✓':'—'}</td><td>${r.gross?'AP':'—'}</td><td>${r.gross?'<span class="tag t-ok">Yes</span>':'<span class="tag t-b">Exempt</span> '+r.exempt_reason}</td><td>01-Apr-2026</td></tr>`).join('')}</table></div>`}
function files(){const I=inc();return `<div class="card"><div class="bar" style="margin-bottom:8px"><b>🏦 AXIS bank bulk upload — preview</b><span class="tag t-i">Primary</span><span class="muted">IFT (Axis→Axis) / NEFT / IMPS</span><span style="flex:1"></span>
<span class="muted">Bank format:</span><select class="s" style="min-width:160px"><option>AXIS neo / CIB</option><option>ICICI CIB</option><option>Generic NEFT CSV</option></select></div>
<table><tr><th>Mode</th><th class="r">Amount</th><th>Value date</th><th>Debit a/c</th><th>Beneficiary</th><th>Account</th><th>IFSC</th><th>Narration</th></tr>${I.map(r=>`<tr><td>${r.mode}</td><td class="r">${inr(r.net)}</td><td>${D.pay_date}</td><td>${mask(D.company.debit_ac)}</td><td>${r.name}</td><td>${mask(r.account)}</td><td>${r.ifsc}</td><td>SALARY ${D.month} ${r.code}</td></tr>`).join('')}
<tr><td><b>TOTAL</b></td><td class="r net">${inr(I.reduce((a,r)=>a+r.net,0))}</td><td colspan="6" class="muted">${I.length} credits · control total must match the approved run</td></tr></table>
<div class="note" style="margin-top:10px">Full account numbers appear only inside the downloaded file (never on screen). File is generated only after Admin approval, carries a SHA-256 checksum, and every download is audit-logged.</div>
<div class="card" style="margin-top:12px;background:#f8fafc"><b>🔌 Direct payout (later phase)</b><div class="muted" style="margin-top:4px">Axis Corporate Payout API · ICICI CIB API · RazorpayX / Cashfree — <span class="tag t-w">Not connected</span> Keys go only in the server .env; payouts still need Admin approval + OTP.</div></div></div>`}
function sett(){return `<div class="card" style="max-width:760px"><b>Payroll settings</b><table style="margin-top:8px">${[['Salary cycle','21st → 20th (from Attendance)'],['Pay date','Last working day of month'],['Debit account','AXIS BANK · '+mask(D.company.debit_ac)],['Default mode','Axis→Axis: IFT · Others: NEFT (IMPS optional)'],['Rounding','Net pay rounded to ₹1'],['Late / half-day rule','From Attendance (after 11:30 = half day)'],['Approver','Admin only (OTP required)'],['Payslip delivery','Employee app + email (PDF, password = PAN first 5 + DOB year)']].map(x=>`<tr><td class="muted" style="width:220px">${x[0]}</td><td><b>${x[1]}</b></td></tr>`).join('')}</table></div>`}
function audit(){return `<div class="card audit"><b>🛡 Audit trail — PR-2026-11-001</b>${[['18-Nov 10:02','HR Santhi Kumari','created Draft run from attendance (9 employees)'],['18-Nov 10:05','HR Santhi Kumari','unselected DIVYA M — bank details missing'],['18-Nov 10:06','HR Santhi Kumari','incentives imported (7 rows, ₹13,200)'],['19-Nov 11:40','System','8/8 checks passed · flagged 2 for review'],['20-Nov 09:15','Admin S Govind Rao','approved & locked — 7 employees, ₹1,32,293.00 (OTP ✓)'],['20-Nov 09:16','Admin S Govind Rao','generated AXIS file · SHA-256 3f9a…c21e · downloaded from 49.xx.xx.12']].map(a=>`<div><span>${a[0]}</span><b>${a[1]}</b> — ${a[2]}</div>`).join('')}</div>`}
function M(h){mb.innerHTML=h;m.classList.add('on')}function X(){m.classList.remove('on')}m.onclick=e=>{if(e.target===m)X()};
function render(){tabsUI();view.innerHTML={run,runs,struct,files,set:sett,audit}[tab]()}render();
