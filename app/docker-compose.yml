# Self-hosted production stack: Postgres + the API (which also serves the web app).
# All secrets/config come from a `.env` file next to this file (copy .env.example → .env).
# `restart: unless-stopped` makes both containers come back automatically after a reboot
# or crash — important for an always-on server.
services:
  db:
    image: postgres:16-alpine
    restart: unless-stopped
    environment:
      POSTGRES_USER: ssd
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-ssd_password}
      POSTGRES_DB: ssd_recovery
    volumes:
      - ssd_pgdata:/var/lib/postgresql/data
    # Expose Postgres to a GUI (DBeaver/pgAdmin) running ON THE SAME PC only.
    # Bound to 127.0.0.1 so it is NOT reachable from the network/internet.
    # To browse from another machine, use an SSH tunnel instead of changing this.
    ports:
      - "127.0.0.1:5432:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ssd -d ssd_recovery"]
      interval: 5s
      timeout: 3s
      retries: 10

  api:
    build: ./backend
    restart: unless-stopped
    depends_on:
      db:
        condition: service_healthy
    # Load ALL settings (LocationIQ, SMTP, TURN, OpenRouter, branding, etc.) from the .env
    # next to this file — one place for every key. The explicit `environment:` block below
    # still wins for DATABASE_URL (must point at the `db` service, not localhost).
    env_file:
      - .env
    environment:
      DATABASE_URL: postgresql+psycopg2://ssd:${POSTGRES_PASSWORD:-ssd_password}@db:5432/ssd_recovery
      SECRET_KEY: ${SECRET_KEY:-dev-secret-change-me}
      ENVIRONMENT: ${ENVIRONMENT:-production}
      ADMIN_EMAIL: ${ADMIN_EMAIL:-admin@ssdrecovery.in}
      ADMIN_PASSWORD: ${ADMIN_PASSWORD:-admin123}
      GOOGLE_MAPS_API_KEY: ${GOOGLE_MAPS_API_KEY:-}
      GOOGLE_CLIENT_ID: ${GOOGLE_CLIENT_ID:-}
      GEMINI_API_KEY: ${GEMINI_API_KEY:-}
      GEMINI_MODEL: ${GEMINI_MODEL:-gemini-2.0-flash}
      UPI_VPA: ${UPI_VPA:-}
      GCS_BUCKET: ${GCS_BUCKET:-}
      LOCATION_PING_SECONDS: ${LOCATION_PING_SECONDS:-60}
    ports:
      - "8000:8000"
    volumes:
      - ./backend:/code/backend
      - ./frontend:/code/frontend
      # Uploaded photos (visits + profile pics) live on a PERSISTENT local volume — stored on
      # this PC's disk, never the cloud, and kept across redeploys/reboots (like the database).
      - ssd_uploads:/code/backend/uploads
    # Creates the admin (from ADMIN_EMAIL/ADMIN_PASSWORD) if missing, then starts the server.
    command: >
      sh -c "python -m app.seed && uvicorn app.main:app --host 0.0.0.0 --port 8000"
    working_dir: /code/backend

volumes:
  ssd_pgdata:
  ssd_uploads:
