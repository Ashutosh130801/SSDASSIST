<script>
  // Safety net: if the app throws, show the message on screen instead of a blank page.
  function ssdShowError(msg){
    var r=document.getElementById('root');
    if(r) r.innerHTML='<div style="max-width:640px;margin:60px auto;padding:22px;border-radius:16px;'
      +'background:#FDECEC;border:1px solid rgba(220,38,38,.4);color:#7f1d1d;'
      +'font-family:system-ui;white-space:pre-wrap;font-size:14px;line-height:1.5">'
      +'<b style="color:#F0776B">App error (please send this to support):</b>\n\n'+String(msg)+'</div>';
  }
  function ssdRootEmpty(){ var r=document.getElementById('root'); return !r || r.children.length===0 || (r.children.length===1 && r.querySelector('.spin')); }
  // Only take over the screen for a genuine STARTUP crash (nothing rendered yet).
  // Once the app is on screen, a failed API call or transient error must not blank it.
  window.addEventListener('error', function(e){ if(ssdRootEmpty()) ssdShowError((e.error&&e.error.stack)||e.message); });
  window.addEventListener('unhandledrejection', function(e){ if(ssdRootEmpty()) ssdShowError('Unhandled: '+((e.reason&&e.reason.stack)||e.reason)); else console.error('Unhandled rejection:', e.reason); });
</script>
<div id="root">
  <div style="display:flex;height:100vh;align-items:center;justify-content:center">
    <div class="spin"></div>
  </div>
</div>
<script>
  // Kill any previously-installed service worker + caches from older versions,
  // then reload ONCE into a clean, worker-free state.
  (function () {
    if (!('serviceWorker' in navigator)) return;
    navigator.serviceWorker.getRegistrations().then(function (regs) {
      var hadController = !!navigator.serviceWorker.controller;
      Promise.all(regs.map(function (r) { return r.unregister(); })).then(function () {
        var clearCaches = window.caches
          ? caches.keys().then(function (ks) { return Promise.all(ks.map(function (k) { return caches.delete(k); })); })
          : Promise.resolve();
        clearCaches.then(function () {
          if (hadController && !sessionStorage.getItem('sw_cleared')) {
            sessionStorage.setItem('sw_cleared', '1');
            location.reload();
          }
        });
      });
    }).catch(function () {});
  })();
</script>
